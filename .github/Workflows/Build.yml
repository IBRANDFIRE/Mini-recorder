name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build tools
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Use your own signing key (optional)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/custom.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/custom.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${KS_KEYPASS:-$KS_PASS}" >> "$GITHUB_ENV"
            echo "Signing with the keystore from repository secrets."
          else
            echo "Signing with app/release.keystore from the repository."
          fi

      - name: Build release APK
        run: gradle --no-daemon assembleRelease --stacktrace

      - name: Name the APK
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "MiniRecorder-build-${{ github.run_number }}.apk"

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: MiniRecorder-APK
          path: MiniRecorder-build-${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Publish APK as a GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mini Recorder build ${{ github.run_number }}
          files: MiniRecorder-build-${{ github.run_number }}.apk
