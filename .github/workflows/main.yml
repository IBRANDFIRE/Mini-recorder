name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK (preinstalled on the runner)
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            ANDROID_HOME=/usr/local/lib/android/sdk
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "Accepting SDK licenses (output hidden)..."
          (yes | "$SDKM" --licenses > /dev/null 2>&1) || true
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ] || [ ! -d "$ANDROID_HOME/build-tools/34.0.0" ]; then
            echo "Installing missing SDK parts (output hidden)..."
            "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /tmp/sdk-install.log 2>&1 || { tail -n 30 /tmp/sdk-install.log; exit 1; }
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Use your own signing key (optional)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/custom.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/custom.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${KS_KEYPASS:-$KS_PASS}" >> "$GITHUB_ENV"
            echo "Signing with the keystore from repository secrets."
          else
            echo "Signing with app/release.keystore from the repository."
          fi

      - name: Build release APK
        run: gradle --no-daemon assembleRelease --stacktrace

      - name: Name the APK
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "MiniRecorder-build-${{ github.run_number }}.apk"

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: MiniRecorder-APK
          path: MiniRecorder-build-${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Publish APK as a GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mini Recorder build ${{ github.run_number }}
          files: MiniRecorder-build-${{ github.run_number }}.apk
